name: PR Check

on:
  pull_request:
    branches:
      - development
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint "src/**/*.ts" --max-warnings=0

      - name: Run unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

  docker-build-validation:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production image build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: prod-distroless
          push: false
          tags: nest-js-ecomm-rd:pr-${{ github.event.pull_request.number || github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
